<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="pt pd">
<title id="pt">Southern Kebbi analysis pipeline</title>
<desc id="pd">Six stages: input sensors, feature engineering, pseudo-labelling and Random Forest classification, change detection, accuracy assessment and benchmarks, and publication outputs.</desc>
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04130d"/>
    <stop offset="0.6" stop-color="#0a2219"/>
    <stop offset="1" stop-color="#22160a"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" x2="1">
    <stop offset="0" stop-color="#74c69d"/>
    <stop offset="1" stop-color="#f4c58c"/>
  </linearGradient>
  <style>
    .t{font:700 15px "Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#ffffff}
    .s{font:500 10.5px ui-monospace,Consolas,monospace;letter-spacing:1.5px}
    .b{font:400 12px "Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#b8c9bf}
    .h{font:600 13px "Segoe UI",Inter,Helvetica,Arial,sans-serif;letter-spacing:4px;fill:#74c69d}
    .card{fill:#ffffff;fill-opacity:.04;stroke-opacity:.45}
    .wire{stroke:url(#flow);stroke-width:2;stroke-dasharray:4 6;fill:none;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1280" height="330" rx="18" fill="url(#pbg)"/>
<text x="48" y="50" class="h">ANALYSIS PIPELINE · python main.py --all</text>

<!-- wires -->
<g>
  <path class="wire" d="M234 182 H254"/>
  <path class="wire" d="M436 182 H456"/>
  <path class="wire" d="M638 182 H658"/>
  <path class="wire" d="M840 182 H860"/>
  <path class="wire" d="M1042 182 H1062"/>
</g>

<!-- 1 -->
<g transform="translate(48,78)">
  <rect class="card" width="186" height="210" rx="14" stroke="#8ecae6"/>
  <circle class="pulse" cx="166" cy="20" r="4" fill="#8ecae6"/>
  <text x="18" y="30" class="s" fill="#8ecae6">INPUTS</text>
  <text x="18" y="56" class="t">7 sensors</text>
  <text x="18" y="84" class="b">Landsat 5 TM · 2000</text>
  <text x="18" y="102" class="b">Landsat 8/9 OLI · 2026</text>
  <text x="18" y="120" class="b">Esri Sentinel-2 LULC 2025</text>
  <text x="18" y="138" class="b">ESA WorldCover 2021</text>
  <text x="18" y="156" class="b">Hansen GFC v1.11</text>
  <text x="18" y="174" class="b">SRTM 30 m DEM</text>
  <text x="18" y="192" class="b">MODIS MOD44B VCF</text>
</g>
<!-- 2 -->
<g transform="translate(254,78)">
  <rect class="card" width="182" height="210" rx="14" stroke="#74c69d"/>
  <circle class="pulse" cx="162" cy="20" r="4" fill="#74c69d" style="animation-delay:.5s"/>
  <text x="18" y="30" class="s" fill="#74c69d">STEPS 01–02</text>
  <text x="18" y="56" class="t">Feature stack</text>
  <text x="18" y="84" class="b">CRS and AOI checks</text>
  <text x="18" y="102" class="b">6 reflectance bands</text>
  <text x="18" y="120" class="b">NDVI · EVI · NDWI</text>
  <text x="18" y="138" class="b">NBR · BSI</text>
  <text x="18" y="156" class="b">Tasseled Cap (3)</text>
  <text x="18" y="174" class="b">Elevation · slope</text>
  <text x="18" y="192" class="b" fill="#d8f3dc">= 16 bands / pixel</text>
</g>
<!-- 3 -->
<g transform="translate(456,78)">
  <rect class="card" width="182" height="210" rx="14" stroke="#95d5b2"/>
  <circle class="pulse" cx="162" cy="20" r="4" fill="#95d5b2" style="animation-delay:1s"/>
  <text x="18" y="30" class="s" fill="#95d5b2">STEPS 03–04</text>
  <text x="18" y="56" class="t">Classify</text>
  <text x="18" y="84" class="b">Pseudo-labels from</text>
  <text x="18" y="102" class="b">Esri, ESA and Hansen</text>
  <text x="18" y="120" class="b">Balanced Random</text>
  <text x="18" y="138" class="b">Forest (120 trees)</text>
  <text x="18" y="156" class="b">Stratified 5-fold CV</text>
  <text x="18" y="192" class="b" fill="#d8f3dc">CV ≈ 80.7–80.9 %</text>
</g>
<!-- 4 -->
<g transform="translate(658,78)">
  <rect class="card" width="182" height="210" rx="14" stroke="#e0a96d"/>
  <circle class="pulse" cx="162" cy="20" r="4" fill="#e0a96d" style="animation-delay:1.5s"/>
  <text x="18" y="30" class="s" fill="#e0a96d">STEP 05</text>
  <text x="18" y="56" class="t">Change</text>
  <text x="18" y="84" class="b">6 × 6 transition matrix</text>
  <text x="18" y="102" class="b">Forest → crop, grass,</text>
  <text x="18" y="120" class="b">bare pathways</text>
  <text x="18" y="138" class="b">ΔNDVI / ΔNBR filter</text>
  <text x="18" y="156" class="b">MMU sieve ≥ 0.45 ha</text>
  <text x="18" y="192" class="b" fill="#f4c58c">173,620 ha gross loss</text>
</g>
<!-- 5 -->
<g transform="translate(860,78)">
  <rect class="card" width="182" height="210" rx="14" stroke="#e88a6a"/>
  <circle class="pulse" cx="162" cy="20" r="4" fill="#e88a6a" style="animation-delay:2s"/>
  <text x="18" y="30" class="s" fill="#e88a6a">STEPS 06–07</text>
  <text x="18" y="56" class="t">Validate</text>
  <text x="18" y="84" class="b">Olofsson et al. (2014)</text>
  <text x="18" y="102" class="b">area-adjusted accuracy</text>
  <text x="18" y="120" class="b">Hansen loss by year</text>
  <text x="18" y="138" class="b">MOD44B canopy trend</text>
  <text x="18" y="156" class="b">ΔNDVI vs ΔNBR</text>
  <text x="18" y="192" class="b" fill="#f8c4b0">R² = 0.686 (N = 3,216)</text>
</g>
<!-- 6 -->
<g transform="translate(1062,78)">
  <rect class="card" width="170" height="210" rx="14" stroke="#f4c58c"/>
  <circle class="pulse" cx="150" cy="20" r="4" fill="#f4c58c" style="animation-delay:2.5s"/>
  <text x="18" y="30" class="s" fill="#f4c58c">STEPS 08a–f</text>
  <text x="18" y="56" class="t">Publish</text>
  <text x="18" y="84" class="b">14 maps · 300 DPI</text>
  <text x="18" y="102" class="b">7 statistical plots</text>
  <text x="18" y="120" class="b">3 animated GIFs</text>
  <text x="18" y="138" class="b">Excel workbook</text>
  <text x="18" y="156" class="b">Word report</text>
  <text x="18" y="174" class="b">HTML dashboard</text>
</g>
</svg>
